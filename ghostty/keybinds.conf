# Optional Ghostty snippet: one-chord access without pressing the tmux prefix.
# Assumes the tmux prefix is Ctrl-a (\x01). Append to ~/.config/ghostty/config.

# left Option acts as Alt (right Option still types special characters)
macos-option-as-alt = left

keybind = alt+d=text:\x01T
keybind = alt+g=text:\x01g
keybind = alt+b=text:\x01G
keybind = alt+c=text:\x01B
